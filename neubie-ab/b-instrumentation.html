<script>
  // ?layout=vertical → B1 / horizontal → B2 (config.variantByLayout)
  NeubieAB.init();
  // NeubieAB.identify({ age_band:'30s', license:'Y', driving_1yr:'Y',
  //   ops_experience:'Y', ops_months:'6mo-1yr', urban_delivery_exp:'N', job_role:'OP' });

  // ── 테스트 빌드: 기존 12스텝 여정 엔진/UI 끄고 테스트 영상 표시 ──
  (function () {
    var cam = document.getElementById('cam-video');
    if (!cam) return;
    try { state.paused = true; state.autoAdvance = false; } catch (e) {} // 레거시 여정 엔진 정지
    // 여정 알림 토스트만 숨김(일시적 여정 메시지 노이즈). 시나리오 카드(#scenario-panel)는 B 디자인이라 유지.
    document.body.classList.add('ab-testmode');
    var _st = document.createElement('style');
    _st.textContent = '.ab-testmode #left-alert-toast,.ab-testmode #cam-alert{display:none!important;}';
    document.head.appendChild(_st);
    var sc = parseInt(new URLSearchParams(location.search).get('scenario'), 10);
    if (sc) {                              // ?scenario=N → 해당 시나리오 + 계측
      NeubieAB.startTrial(sc);
      NeubieAB.loadScenarioVideo(cam, sc); // S3=배정 taxi/bump, 그 외=config.scenarios[n].video
      NeubieAB.bindVideo(cam, sc);         // video-trigger(S2·S3·S6) 트리거 시점 자동 markStimulus
    } else {                               // 미지정 → 기본 피드
      cam.src = (window.NeubieConfig && NeubieConfig.defaultVideo) || '';
    }
    if (cam.load) cam.load();
    if (cam.play) cam.play().catch(function () {});
  })();
  // 응답(T3) 훅은 [횡단하기]·[주행 불가능] 등 액션 버튼 구현 후 연결
</script>
