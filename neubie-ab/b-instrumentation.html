<script>
  // ?layout=vertical → B1 / horizontal → B2 (config.variantByLayout)
  NeubieAB.init();
  // NeubieAB.identify({ age_band:'30s', license:'Y', driving_1yr:'Y',
  //   ops_experience:'Y', ops_months:'6mo-1yr', urban_delivery_exp:'N', job_role:'OP' });

  // ── 테스트 빌드: 여정 알림 토스트만 숨김(시나리오 카드는 유지) ──
  (function () {
    var cam = document.getElementById('cam-video');
    if (!cam) return;
    document.body.classList.add('ab-testmode');
    var _st = document.createElement('style');
    _st.textContent = '.ab-testmode #left-alert-toast,.ab-testmode #cam-alert{display:none!important;}'
      // (2) 사용성 테스트(개발용) 버튼 숨김
      + '.ab-testmode #ut-start-btn{display:none!important;}'
      // (3) 카메라 영상 업로드 오버레이 숨김
      + '.ab-testmode #cam-upload-overlay{display:none!important;}'
      // (4) 로봇 설정 ON 색상을 tertiary-300(오렌지)로 통일 (헤드램프/게임패드 등 .on이 초록이던 것)
      + '.ab-testmode .ctrl-btn.on{color:#F8914A!important;border-color:rgba(248,145,74,0.5)!important;}'
      // (1) 횡단보도 오버레이: 원래 위치 유지(가로=지도 상단, 세로=지도 우측). 오버레이는 클릭 통과시키고 버튼만 클릭 → 지도 줌/이동 그대로
      + '.ab-testmode #xwalk-overlay.show{pointer-events:none!important;}'
      + '.ab-testmode #xwalk-overlay.show #xwalk-btn{pointer-events:auto!important;}'
      // vertical(layout-b): 지도가 min-height:340px 때문에 하단 220px 섹션을 넘쳐 화면 밖으로 잘림 → 섹션에 맞춤
      + 'body.layout-b.ab-testmode #map-section{min-height:0!important;height:100%!important;}'
      // vertical(layout-b): 카메라 영역 padding-left 142px
      + 'body.layout-b.ab-testmode #camera-section{padding-left:142px!important;}'
      // 배터리 에러(저전력) 시 아이콘 전체를 red-400(#FA5952)으로 (테두리/채움/꼭지/번개/% 통일)
      + '.ab-testmode .battery-info.batt-error,.ab-testmode .battery-info.batt-error span{color:#FA5952!important;}'
      + '.ab-testmode .battery-info.batt-error .battery-icon{border-color:#FA5952!important;}'
      + '.ab-testmode .battery-info.batt-error .battery-icon::after{background:#FA5952!important;}'
      + '.ab-testmode .battery-info.batt-error .battery-fill{background:#FA5952!important;}'
      + '.ab-testmode .battery-info.batt-error svg path{fill:#FA5952!important;}';
    document.head.appendChild(_st);

    // 배터리 저전력(≤20%) 시 .battery-info에 batt-error 토글 → 위 CSS가 전체 red-400
    try {
      setInterval(function () {
        var info = document.querySelector('.battery-info');
        if (info && typeof state !== 'undefined' && state.battery != null)
          info.classList.toggle('batt-error', Math.round(state.battery) <= 20);
      }, 500);
    } catch (e) {}

    var qs = new URLSearchParams(location.search);
    var sc = parseInt(qs.get('scenario'), 10);
    var pid = qs.get('pid');

    // ── 시나리오별 알림 로그 (config.scenarioAlerts → #log-entries) ──
    // addLog가 IIFE 스코프라 호출 불가 → B의 로그 행(.log-row>.log-time+.log-msg)을 동일하게 직접 생성
    var _alertTimers = [];
    function appendAlert(level, msg) {
      var le = document.getElementById('log-entries'); if (!le) return;
      le.querySelectorAll('.latest').forEach(function (el) { el.classList.remove('latest'); }); // 이전 최신 해제
      var row = document.createElement('div'); row.className = 'log-row latest' + (level != null ? ' level-' + level : '');
      var t = document.createElement('span'); t.className = 'log-time'; t.textContent = new Date().toTimeString().slice(0, 5);
      var m = document.createElement('span'); m.className = 'log-msg'; m.textContent = msg;
      row.appendChild(t); row.appendChild(m); le.appendChild(row); // 새 알림 = 맨 아래
      var panel = document.getElementById('log-panel');            // 새 알림으로 스크롤다운 + 포커스
      if (panel) panel.scrollTop = panel.scrollHeight;
      if (row.scrollIntoView) { try { row.scrollIntoView({ block: 'nearest' }); } catch (e) {} }
    }
    function scheduleAlerts(scn) {
      _alertTimers.forEach(clearTimeout); _alertTimers = []; // 이전 시나리오의 대기중 알림만 취소(표시된 로그는 쌓아둠)
      var list = (window.NeubieConfig && NeubieConfig.scenarioAlerts && NeubieConfig.scenarioAlerts[scn]) || [];
      list.forEach(function (a) {
        if (a.trigger) { // [횡단하기]/[도착 처리] 클릭 시
          var id = a.trigger === 'xwalk' ? 'xwalk-btn' : (a.trigger === 'arrival' ? 'btn-arrival' : null);
          var btn = id && document.getElementById(id);
          if (btn) btn.addEventListener('click', function () { appendAlert(a.level, a.msg); }, { once: true });
        } else if ((a.delay || 0) <= 0) {
          appendAlert(a.level, a.msg);
        } else {
          _alertTimers.push(setTimeout(function () { appendAlert(a.level, a.msg); }, a.delay));
        }
      });
    }

    // 시나리오 셋업: B 자체 시스템 loadScenarioTest(영상+횡단보도+상태)에 위임 + 계측 바인딩.
    // (흐름이면 [시작하기]에서, 아니면 즉시 실행)
    function setupScenario() {
      if (!sc) { // 미지정 → 기본 피드
        try { state.paused = true; state.autoAdvance = false; } catch (e) {}
        cam.src = (window.NeubieConfig && NeubieConfig.defaultVideo) || '';
        if (cam.load) cam.load(); if (cam.play) cam.play().catch(function () {});
        return;
      }
      var ctx = NeubieAB.startTrial(sc);
      if (typeof loadScenarioTest === 'function' && typeof SCENARIO_TESTS !== 'undefined') {
        var testNum = 1;                                  // 기본 test1
        if (sc === 1 && ctx.sub_test) testNum = ctx.sub_test;                       // 1=wifi500, 2=battery17
        else if (sc === 3 && ctx.stimulus_video) testNum = ctx.stimulus_video === 'bump' ? 2 : 1; // taxi=1, bump=2
        var idx = SCENARIO_TESTS.findIndex(function (t) { return t.sc === sc && t.test === testNum; });
        if (idx >= 0) { loadScenarioTest(idx); }          // ← 횡단보도 등 시나리오 UI 표시
        else { try { state.paused = true; state.autoAdvance = false; } catch (e) {} NeubieAB.loadScenarioVideo(cam, sc); if (cam.load) cam.load(); if (cam.play) cam.play().catch(function () {}); }
      } else { // 폴백: loadScenarioTest 없으면 영상만
        try { state.paused = true; state.autoAdvance = false; } catch (e) {}
        NeubieAB.loadScenarioVideo(cam, sc); if (cam.load) cam.load(); if (cam.play) cam.play().catch(function () {});
      }
      NeubieAB.bindVideo(cam, sc); // video-trigger(S2·S3·S6) 트리거 시점 자동 markStimulus
      scheduleAlerts(sc);          // 시나리오 알림 로그 시점대로 표시
    }
    window.__neubieScenarioStart = setupScenario; // flow가 [시작하기]에서 호출

    // 흐름 세션이면 flow 인트로의 [시작하기]가 setupScenario 호출. 아니면 즉시(직접 URL 테스트).
    if (!(window.NeubieFlow && pid && NeubieFlow.active(pid) && sc)) setupScenario();
  })();
  // 응답(T3) 훅: 액션 버튼 클릭에서 NeubieAB.markResponse(r); NeubieFlow.complete(r);
</script>
<!-- NEUBIE-AB:END -->
